server:
  port: ${PORT:8081}

spring:
  application:
    name: captur-payments
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/captur_payments}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

payments:
  # Privy JWT verification (authentication only — roles resolved via captur-api)
  privy:
    app-id: ${PRIVY_APP_ID:}
    app-secret: ${PRIVY_APP_SECRET:}
    api-base-url: ${PRIVY_API_BASE_URL:https://api.privy.io}
    timeout-ms: ${PRIVY_API_TIMEOUT_MS:15000}
    jwks-url: ${PRIVY_JWKS_URL:https://auth.privy.io/api/v1/apps/${PRIVY_APP_ID}/jwks.json}
  # Admin authorization: emails allowed to call /admin/* endpoints.
  # Roles themselves are verified server-side against captur-api /admin/auth/verify.
  admin-roles: ${PAYMENTS_ADMIN_ROLES:ADMIN,FINANCE}
  # Read-only captur-api integration — the caller's Bearer token is forwarded.
  captur-api:
    base-url: ${CAPTUR_API_URL:https://captur-api-208129623932.asia-east2.run.app}
    timeout-ms: ${CAPTUR_API_TIMEOUT_MS:15000}
    submissions-page-size: ${CAPTUR_PAGE_SIZE:100}
    submissions-max-pages: ${CAPTUR_MAX_PAGES:20}
  # Reward calculation — hourly tier rates per "How Rewards Work" spec.
  # Rates are USD/hour == USDC/hour (spec §9.8 pending final confirmation).
  rewards:
    tier-full-usd-per-hour: ${REWARD_TIER_FULL:5.00}
    tier-iphone-usd-per-hour: ${REWARD_TIER_IPHONE:4.50}
    tier-basic-usd-per-hour: ${REWARD_TIER_BASIC:3.75}
    auto-sync-enabled: ${REWARD_AUTO_SYNC:false}
    auto-sync-interval-ms: ${REWARD_SYNC_INTERVAL_MS:300000}
    auto-sync-initial-delay-ms: ${REWARD_SYNC_INITIAL_DELAY_MS:60000}
  # Payout transport selection. `keypair` = raw Solana keypair (legacy),
  # `privy` = Privy Wallet Actions API against a Privy-managed treasury
  # wallet. Ledger/batch/approval logic is identical for both.
  payout:
    provider: ${PAYOUT_PROVIDER:keypair}
    enabled: ${PAYOUT_ENABLED:${SOLANA_ENABLED:false}}
  # Privy Wallet Actions payout execution (provider=privy). Devnet only —
  # `chain` must stay solana_devnet until mainnet custody is decided.
  privy-payout:
    enabled: ${PRIVY_PAYOUT_ENABLED:false}
    treasury-wallet-id: ${PRIVY_TREASURY_WALLET_ID:}
    chain: ${PRIVY_PAYOUT_CHAIN:solana_devnet}
    usdc-decimals: ${PRIVY_PAYOUT_USDC_DECIMALS:6}
    action-timeout-ms: ${PRIVY_PAYOUT_ACTION_TIMEOUT_MS:120000}
    action-poll-ms: ${PRIVY_PAYOUT_ACTION_POLL_MS:3000}
  # Solana — execution DISABLED until config confirmed. Devnet only for now.
  solana:
    enabled: ${SOLANA_ENABLED:false}
    cluster: ${SOLANA_CLUSTER:devnet}
    rpc-url: ${SOLANA_RPC_URL:}
    usdc-mint: ${SOLANA_USDC_MINT:}
    treasury-address: ${SOLANA_TREASURY_ADDRESS:}
    treasury-secret-key: ${SOLANA_TREASURY_SECRET_KEY:}   # base58 devnet keypair — Secret Manager only
    usdc-decimals: ${SOLANA_USDC_DECIMALS:6}
    confirm-timeout-ms: ${SOLANA_CONFIRM_TIMEOUT_MS:90000}
    confirm-poll-ms: ${SOLANA_CONFIRM_POLL_MS:2000}
    max-concurrent-payments: ${SOLANA_MAX_CONCURRENT:5}
    # Reconciliation of submitted/ambiguous transactions — read-only chain
    # checks. Disabled by default; devnet only. Never sends transactions.
    reconcile-enabled: ${SOLANA_RECONCILE_ENABLED:false}
    reconcile-interval-ms: ${SOLANA_RECONCILE_INTERVAL_MS:60000}
    reconcile-initial-delay-ms: ${SOLANA_RECONCILE_INITIAL_DELAY_MS:30000}
    reconcile-batch-size: ${SOLANA_RECONCILE_BATCH_SIZE:50}

logging:
  level:
    com.capturgo.payments: INFO
    root: WARN
